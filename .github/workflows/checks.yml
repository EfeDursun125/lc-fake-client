name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Run policy checks
        run: dotnet run --project tests/PolicyChecks/PolicyChecks.csproj -c Release
      - name: Run emote compatibility checks
        run: dotnet run --project tests/EmoteCompatibilityChecks/EmoteCompatibilityChecks.csproj -c Release
